name: Mobile

on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [master]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Expo app — typecheck, lint, unit, web export, Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (Tier 1)
        run: npm run test

      - name: Export web bundle
        run: npm run export:web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Tier 2)
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/mobile/playwright-report/
          retention-days: 14

      - name: Upload phase screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-01-screenshots
          path: docs/migration/screenshots/phase-01/
          retention-days: 14
