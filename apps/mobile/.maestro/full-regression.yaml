# Rewards / stickers
- tapOn:
    id: bottom-nav-stickers
- assertVisible:
    id: stickers-root

# Parent gate via deep link (TopBar hold is a custom timer)
- tapOn:
    id: bottom-nav-home
- openLink: talki://parent
- assertVisible:
    id: parent-gate-question
- tapOn:
    id: parent-gate-back
- assertVisible:
    id: home-root
