# Rewards / stickers
- tapOn:
    id: bottom-nav-stickers
- assertVisible:
    id: stickers-root

# Parent gate (hold is Maestro longPressOn)
- tapOn:
    id: bottom-nav-home
- longPressOn:
    id: parent-button
- assertVisible:
    id: parent-gate-question
- tapOn:
    id: parent-gate-back
- assertVisible:
    id: home-root
