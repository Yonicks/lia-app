      id: games-menu-card-puzzle
    direction: DOWN
    timeout: 10000
- tapOn:
    id: games-menu-card-puzzle
- assertVisible:
    id: puzzle-root
- back
- assertVisible:
    id: games-menu-root
- scrollUntilVisible:
    element:
      id: games-menu-card-match
    direction: DOWN
    timeout: 10000
- tapOn:
    id: games-menu-card-match
- assertVisible:
