# Debug APK from `npx expo run:android` (no APP_VARIANT) is com.yonicks.talki.
# Dev-client builds with APP_VARIANT=development use com.yonicks.talki.dev.
appId: com.yonicks.talki
---
# Phase 14 full regression — every game and every practice mode.
- launchApp:
    arguments:
      intro: '0'
- extendedWaitUntil:
    visible:
      id: home-root
    timeout: 15000

# Home → category → cards → Home (use hardware back; in-app back can race the shell)
- tapOn:
    id: home-category-animals
- assertVisible:
    id: category-root
- tapOn:
    id: category-cards
- assertVisible:
    id: cards-root
- back
- runFlow:
    when:
      visible:
        id: category-root
    commands:
      - tapOn:
          id: category-back
- assertVisible:
    id: home-root

# Games menu (scroll — lower cards sit below the fold on phone)
- tapOn:
    id: bottom-nav-games
- assertVisible:
    id: games-menu-root
- tapOn:
    id: games-menu-card-quiz
- assertVisible:
    id: quiz-root
- back
- assertVisible:
    id: games-menu-root
- tapOn:
    id: games-menu-card-memory
- assertVisible:
    id: memory-root
- back
- assertVisible:
    id: games-menu-root
- tapOn:
    id: games-menu-card-missing
- assertVisible:
    id: missing-root
- back
- assertVisible:
    id: games-menu-root
- scrollUntilVisible:
