appId: com.yonicks.talki
---
# Phase 12 Tier 3: open parent gate, assert challenge, return.
# TopBar hold is a custom 900ms timer — Maestro longPressOn does not unlock it.
- launchApp:
    arguments:
      intro: '0'
- assertVisible:
    id: 'home-root'
- openLink: talki://parent
- assertVisible:
    id: 'parent-gate-question'
- takeScreenshot: phase-12-parent-gate
- tapOn:
    id: 'parent-gate-back'
- assertVisible:
    id: 'home-root'
