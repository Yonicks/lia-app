appId: com.yonicks.talki
---
# Phase 7/19 navigation spine: Home -> category -> back -> Games (side nav)
# -> Rewards (points) -> back to Games -> Home, using hardware/gesture back
# and landscape side/top chrome (never a browser-only affordance).
- launchApp:
    arguments:
      intro: '0'
- assertVisible:
    id: 'home-root'
- takeScreenshot: phase-07-home
- assertVisible:
    id: 'home-category-animals'
- tapOn:
    id: 'home-category-animals'
- assertVisible:
    id: 'category-root'
- takeScreenshot: phase-07-category
- assertVisible:
    id: 'category-word-0'
- tapOn:
    id: 'category-word-0'
- back
- assertVisible:
    id: 'home-root'
- tapOn:
    id: 'landscape-side-end'
- assertVisible:
    id: 'games-menu-root'
- takeScreenshot: phase-07-games-menu
- tapOn:
    id: 'landscape-rewards-entry'
- assertVisible:
    id: 'stickers-root'
- takeScreenshot: phase-07-rewards
- back
- assertVisible:
    id: 'games-menu-root'
- tapOn:
    id: 'landscape-side-start'
- assertVisible:
    id: 'home-root'
