/* ============================================================
   7. EVENTS
============================================================ */
function on(sel, fn){ document.querySelectorAll(sel).forEach(el=>el.addEventListener('click', ()=>fn(el))); }

const alive = t => !!game && game.type===t && view===t && !game.done;

function bind(){
  on('[data-nav]', el=>{
    const v = el.dataset.nav;
    game = null;
    if(v==='parent'){ view='parent'; render(); preloadRecs(activeCat||'animals').then(()=>{ if(view==='parent') render(); }); return; }
    view = v; render();
  });
  on('[data-cat]', el=>{ activeCat=el.dataset.cat; view='category'; render(); });
  on('[data-cards]', el=>{ activeCat=el.dataset.cards; cardIdx=0; view='cards'; render(); });
  on('[data-play]', el=>{ launch('quiz', el.dataset.play); });
  on('[data-practice]', el=>{ activeCat=el.dataset.practice; view='practice'; render(); });
  on('[data-stickerfilter]', el=>{ stickerFilter=el.dataset.stickerfilter; render(); });
  on('[data-game]', el=>{
    const g = el.dataset.game;
    const fallback = (allCats().find(c=>c.items.length>=4) || allCats()[0]).id;
    if(g==='cards'){
      const cur = getCat(activeCat);
      activeCat = (cur && cur.items.length) ? activeCat : fallback;
      cardIdx = 0; view='cards'; render();
    }
    else launch(g, activeCat||fallback);
  });

  /* word tiles */
  on('.tile', el=>{
    const word = el.dataset.word, k = key(activeCat,word);
    const cat = getCat(activeCat), item = cat.items.find(i=>i.word===word);
    const isNew = !learned.has(k);
    say(activeCat, word, item && item.sound && settings.sounds ? {
      after:()=>setTimeout(()=>speakTTS(item.sound,{}), 200)
    } : {});
    learned.add(k);
    if(isNew){
      saveProgress(); chime(true);
      if(learned.size % 10 === 0) celebrate(`${learned.size} מילים!`);
    }
    el.classList.add('pop');
    setTimeout(()=>{ el.classList.remove('pop'); render(); }, 420);
  });

  /* flashcards */
  const flash = document.getElementById('flash');
  if(flash){
    const cat = getCat(activeCat);
    const go = d => {
      cardIdx = (cardIdx + d + cat.items.length) % cat.items.length;
      render();
      const w = cat.items[cardIdx].word;
      learned.add(key(cat.id,w)); saveProgress();
      setTimeout(()=>say(cat.id,w),150);
    };
    flash.addEventListener('click', ()=>say(cat.id, cat.items[cardIdx].word));
    let x0=null;
    flash.addEventListener('touchstart', e=>{ x0=e.touches[0].clientX; }, {passive:true});
    flash.addEventListener('touchend', e=>{
      if(x0===null) return;
      const dx = e.changedTouches[0].clientX - x0; x0=null;
      if(Math.abs(dx)>50) go(dx>0 ? -1 : 1);
    });
    on('[data-card="next"]', ()=>go(1));
    on('[data-card="prev"]', ()=>go(-1));
    on('[data-card="say"]', ()=>say(cat.id, cat.items[cardIdx].word));
  }

  /* shared game controls */
  const gc = document.getElementById('gameCat');
  if(gc) gc.addEventListener('change', ()=> launch(game.type, gc.value));
  on('[data-say]', ()=>{
    if(game && game.type==='quiz') say(game.catId, game.target.word);
    else if(game && game.type==='speech') say(game.catId, game.pool[game.i].word);
  });
  on('[data-again]', ()=> launch(game.type, game.catId));

  /* quiz */
  on('[data-opt]', el=>{
    if(game.locked) return;
    const word = el.dataset.opt, ok = word===game.target.word;
    markSeen(game.catId, game.target.word, !ok);
    if(ok){
      game.locked = true; el.classList.add('correct'); chime(true);
      game.score++; game.streak++; game.best = Math.max(game.best, game.streak);
      if(game.streak%3===0) confetti(26);
      const k = key(game.catId, word);
      if(!learned.has(k)){ learned.add(k); saveProgress(); }
      setTimeout(()=>{ if(!alive('quiz')) return; game.i++; nextQuiz(); }, 750);
    }else{
      el.classList.add('wrong'); chime(false); game.streak=0;
      setTimeout(()=>el.classList.remove('wrong'), 420);
    }
  });

  /* memory */
  on('[data-mem]', el=>{
    if(game.locked) return;
    const c = game.cards[+el.dataset.mem];
    if(c.open || c.matched) return;
    c.open = true;
    if(c.kind==='pic') say(game.catId, c.it.word); else say(game.catId, c.it.word);
    if(game.first===null){ game.first = c.idx; render(); return; }
    game.moves++;
    const a = game.cards[game.first];
    if(a.pair===c.pair && a.idx!==c.idx){
      a.matched=c.matched=true; game.found++; game.first=null;
      const willComplete = game.found===game.total;
      chime(true, {isLevelComplete: willComplete});
      learned.add(key(game.catId,c.it.word)); saveProgress();
      if(willComplete){ game.done=true; confetti(34); }
      render();
    }else{
      game.locked=true; chime(false); render();
      setTimeout(()=>{ if(!alive('memory')) return; a.open=false; c.open=false; game.first=null; game.locked=false; render(); }, 900);
    }
  });

  /* what's missing */
  on('[data-guess]', el=>{
    const ok = el.dataset.guess === game.missing.word;
    markSeen(game.catId, game.missing.word, !ok);
    if(ok){
      game.score++; chime(true); confetti(16);
      say(game.catId, game.missing.word);
      learned.add(key(game.catId,game.missing.word)); saveProgress();
    } else { chime(false); el.classList.add('wrong'); }
    setTimeout(()=>{
      if(!alive('missing')) return;
      game.round++;
      if(game.round>=5){ game.done=true; AudioManager.playSfx('game.levelComplete'); render(); } else nextMissing();
    }, ok?900:500);
  });

  /* match */
  on('[data-mleft]', el=>{ game.sel = el.dataset.mleft; say(game.catId, game.sel); render(); });
  on('[data-mright]', el=>{
    if(!game.sel){ toast('קודם בוחרים מילה'); return; }
    const ok = el.dataset.mright === game.sel;
    markSeen(game.catId, game.sel, !ok);
    if(ok){
      game.matched.push(game.sel); learned.add(key(game.catId,game.sel)); saveProgress();
      const willComplete = game.matched.length===game.left.length;
      chime(true, {kind:'match', isLevelComplete: willComplete}); game.sel=null;
      if(willComplete){ game.done=true; confetti(30); }
      render();
    }else{
      chime(false, {kind:'match'}); el.classList.add('wrong');
      setTimeout(()=>el.classList.remove('wrong'),420);
    }
  });

  /* speech recognition */
  on('[data-mic]', ()=>startListening());
  on('[data-skip]', ()=>{ game.i++; if(game.i>=game.pool.length) game.done=true; game.feedback=''; render(); });

  /* bubbles */
  if(view==='bubbles' && game && !game.done){
    if(bubbleTimer) clearInterval(bubbleTimer);
    for(let i=0;i<3;i++) setTimeout(spawnBubble, i*700);
    bubbleTimer = setInterval(spawnBubble, 1400);
  }

  /* animal sounds */
  if(view==='sounds' && game && !game.done && !game.played){
    game.played = true;
    setTimeout(()=>speakTTS(game.target.sound,{}), 400);
  }
  on('[data-playsound]', ()=> speakTTS(game.target.sound,{}));
  on('[data-sopt]', el=>{
    if(game.locked) return;
    const ok = el.dataset.sopt === game.target.word;
    markSeen('animals', game.target.word, !ok);
    if(ok){
      game.locked=true; el.classList.add('correct'); chime(true); game.score++;
      say('animals', game.target.word);
      learned.add(key('animals',game.target.word)); saveProgress();
      confetti(14);
      setTimeout(()=>{ if(!alive('sounds')) return; game.i++; game.played=false; setupSoundsRound(); render(); }, 1100);
    }else{ el.classList.add('wrong'); chime(false); setTimeout(()=>el.classList.remove('wrong'),420); }
  });

  /* counting */
  on('[data-count]', el=>{
    if(game.locked) return;
    const ok = +el.dataset.count === game.n;
    if(ok){
      game.locked=true; el.classList.add('correct'); chime(true); game.score++; confetti(14);
      speakTTS(plain(NUM_WORDS[game.n]) + ' ' + plain(game.it.word), {});
      setTimeout(()=>{ if(!alive('count')) return; game.round++; setupCountRound(); render(); }, 1300);
    }else{ el.classList.add('wrong'); chime(false); setTimeout(()=>el.classList.remove('wrong'),420); }
  });

  /* sorting */
  on('[data-box]', el=>{
    if(game.locked) return;
    const ok = el.dataset.box === game.right.id;
    markSeen(game.right.id, game.it.word, !ok);
    if(ok){
      game.locked=true; el.classList.add('correct'); chime(true, {kind:'match'}); game.score++; confetti(14);
      say(game.right.id, game.it.word);
      learned.add(key(game.right.id,game.it.word)); saveProgress();
      setTimeout(()=>{ if(!alive('sort')) return; game.round++; setupSortRound(); render(); }, 1100);
    }else{ el.classList.add('wrong'); chime(false, {kind:'match'}); setTimeout(()=>el.classList.remove('wrong'),420); }
  });

  /* A. focused stimulation */
  if(view==='focus' && game && !game.done && !game.spoke){
    game.spoke = true;
    setTimeout(()=>{
      if(!alive('focus') || !CARRIERS[game.step]) return;
      speakTTS(plain(CARRIERS[game.step].replace('{w}', plain(game.it.word))), {});
    }, 350);
  }
  const fc = document.getElementById('focusCard');
  if(fc) fc.addEventListener('click', ()=>{
    const k = key(game.catId, game.it.word);
    if(!learned.has(k)){ learned.add(k); saveProgress(); }
    game.step++;
    if(game.step >= game.total){ game.done = true; confetti(26); AudioManager.playSfx('game.levelComplete'); markSeen(game.catId, game.it.word, false); render(); return; }
    game.spoke = false; render();
  });
  on('[data-nextword]', ()=> launch('focus', game.catId));

  /* B. cloze */
  if(view==='cloze' && game && !game.done && !game.started){ game.started = true; setTimeout(runCloze, 250); }
  on('[data-clozeyes]', ()=>{
    const willComplete = game.i+1 >= game.pool.length;
    chime(true, {isLevelComplete: willComplete});
    if(!willComplete) confetti(18);
    clozeNext(true);
  });
  on('[data-clozenext]', ()=> clozeNext(false));

  /* C. communication temptation */
  if(view==='temptation' && game && !game.done && !game.asked){
    game.asked = true;
    setTimeout(()=>{ if(alive('temptation')) speakTTS('מָה יֵשׁ בַּצִּנְצֶנֶת?',{}); }, 350);
  }
  on('[data-temptopen]', ()=> openJar());
  on('[data-temptmic]', ()=> listenForAnything());
  on('[data-temptnext]', ()=>{
    game.i++; game.opened=false; game.asked=false;
    if(game.i>=game.pool.length){ game.done=true; confetti(30); AudioManager.playSfx('game.levelComplete'); }
    render();
  });

  /* D. receptive identification */
  if(view==='receptive' && game && !game.done && !game.asked){
    game.asked = true;
    setTimeout(()=>{ if(alive('receptive')) speakTTS('תַּרְאִי לִי ' + plain(game.target.word), {}); }, 350);
  }
  on('[data-receptsay]', ()=> speakTTS('תַּרְאִי לִי ' + plain(game.target.word), {}));
  on('[data-recept]', el=>{
    if(game.locked) return;
    const ok = el.dataset.recept === game.target.word;
    markSeen(game.catId, game.target.word, !ok);
    if(ok){
      game.locked = true; el.classList.add('correct'); chime(true); game.score++; game.run++; game.miss=0;
      say(game.catId, game.target.word);
      learned.add(key(game.catId,game.target.word)); saveProgress();
      if(game.run>=3 && game.level<4){ game.level++; game.run=0; toast('עולים רמה 🎉'); }
      confetti(12);
      setTimeout(()=>{ if(!alive('receptive')) return; game.i++; game.asked=false; setupReceptiveRound(); render(); }, 1100);
    }else{
      el.classList.add('wrong'); chime(false); game.run=0; game.miss++;
      if(game.miss>=2 && game.level>2){ game.level--; game.miss=0; game.asked=false; setupReceptiveRound(); setTimeout(()=>{ if(alive('receptive')) render(); },420); }
      setTimeout(()=>el.classList.remove('wrong'), 420);
    }
  });

  /* E. minimal pairs */
  if(view==='pairs' && game && !game.done && !game.asked){
    game.asked = true;
    setTimeout(()=>{ if(alive('pairs')) speakTTS(plain(game.target.word),{}); }, 350);
  }
  on('[data-pairsay]', ()=> speakTTS(plain(game.target.word),{}));
  on('[data-pair]', el=>{
    if(game.locked) return;
    const ok = el.dataset.pair === game.target.word;
    if(ok){
      game.locked = true; el.classList.add('correct'); chime(true); game.score++; confetti(12);
      speakTTS('כֵּן, ' + plain(game.target.word), {});
      setTimeout(()=>{ if(!alive('pairs')) return; game.i++; game.asked=false; setupPairsRound(); render(); }, 1200);
    }else{
      el.classList.add('wrong'); chime(false);
      const other = game.pair.find(p=>p.word!==game.target.word);
      speakTTS('זֶה ' + plain(other.word) + '. אֲנִי אָמַרְתִּי ' + plain(game.target.word), {});
      setTimeout(()=>el.classList.remove('wrong'), 600);
    }
  });

  /* F. two-word combinations */
  on('[data-mod]', el=>{ game.mod = el.dataset.mod; game.phrase=''; speakTTS(plain(game.mod),{}); render(); });
  on('[data-combine]', el=>{
    const word = el.dataset.combine;
    const mod = MODIFIERS.find(m=>m.w===(game.mod||MODIFIERS[0].w));
    game.mod = mod.w;
    game.phrase = display(mod.w) + ' ' + display(word);
    game.round++;
    chime(true);
    const k = key(game.catId, word);
    if(!learned.has(k)){ learned.add(k); saveProgress(); }
    render();
    speakTTS(plain(mod.w)+' '+plain(word), {after:()=>
      setTimeout(()=>speakTTS(plain(mod.expand.replace('{w}', plain(word))), {}), 250)});
    if(game.round>=6){ setTimeout(()=>{ if(!alive('combine')) return; game.done=true; confetti(28); AudioManager.playSfx('game.levelComplete'); render(); }, 2600); }
  });

  /* parent */
  on('[data-ptab]', el=>{ parentTab = el.dataset.ptab; render(); });
  on('[data-key]', el=>{
    const k = el.dataset.key;
    if(k==='clear') lockInput = lockInput.slice(0,-1);
    else if(k==='ok'){
      if(+lockInput === lockAnswer.sum){ unlocked=true; lockAnswer=null; lockInput=''; }
      else { toast('לא נכון, נסו שוב'); lockInput=''; }
    } else if(lockInput.length<4) lockInput += k;
    render();
  });
  on('[data-rate]', el=>{ settings.rate = parseFloat(el.dataset.rate); saveSettings(); syncSpeedIcon(); render(); });
  on('[data-toggle]', el=>{
    const id=el.dataset.toggle; settings[id]=!settings[id]; saveSettings();
    if(id==='music') setMusic(settings.music);
    else if(id==='sounds') AudioManager.setSfxEnabled(settings.sounds);
    else if(id==='voice') AudioManager.setVoiceEnabled(settings.voice);
    render();
  });
  on('[data-mvol]', el=>{
    settings.musicVol = parseFloat(el.dataset.mvol); saveSettings();
    AudioManager.setMusicVolumeMultiplier(settings.musicVol);
    render();
  });
  on('[data-reset]', async ()=>{
    if(!confirm('לאפס את כל ההתקדמות? ההקלטות והמילים האישיות יישארו. מומלץ לייצא גיבוי קודם.')) return;
    learned = new Set(); stats = {}; await saveProgress(); await saveStats(); toast('ההתקדמות אופסה'); render();
  });
  const recCat = document.getElementById('recCat');
  if(recCat) recCat.addEventListener('change', async ()=>{ activeCat = recCat.value; await preloadRecs(activeCat); render(); });
  on('[data-recplay]', el=>say(activeCat, el.dataset.recplay));
  on('[data-recstart]', el=>recordWord(activeCat, el.dataset.recstart));
  on('[data-recdel]', async el=>{
    const k = key(activeCat, el.dataset.recdel);
    await sDel(K.rec(k)); recordings[k]=null; toast('ההקלטה נמחקה'); render();
  });

  const photoInput = document.getElementById('cwPhoto');
  if(photoInput) photoInput.addEventListener('change', handlePhoto);
  const addBtn = document.getElementById('cwAdd');
  if(addBtn) addBtn.addEventListener('click', addCustomWord);
  on('[data-cwdel]', async el=>{
    const id = el.dataset.cwdel;
    const item = custom.find(c=>c.id===id);
    custom = custom.filter(c=>c.id!==id);
    await sDel(K.custom(id));
    await sSet(K.customIndex, custom.map(c=>c.id));
    if(item) { learned.delete(key('mine',item.word)); saveProgress(); }
    render();
  });
  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.addEventListener('click', exportBackup);
  const impMerge = document.getElementById('importMerge');
  if(impMerge) impMerge.addEventListener('change', e=>{
    const f = e.target.files[0]; if(f) importBackup(f, 'merge'); e.target.value='';
  });
  const impReplace = document.getElementById('importReplace');
  if(impReplace) impReplace.addEventListener('change', e=>{
    const f = e.target.files[0]; if(!f) return;
    if(confirm('השחזור ימחק את כל הנתונים הקיימים במכשיר ויחליף אותם בקובץ. להמשיך?')) importBackup(f, 'replace');
    e.target.value='';
  });
  const storageInfo = document.getElementById('storageInfo');
  if(storageInfo){
    const names = {indexeddb:'IndexedDB (קבוע במכשיר)', artifact:'אחסון הצ\'אט', memory:'זיכרון זמני — לא יישמר!'};
    Store.estimate().then(est=>{
      const el = document.getElementById('storageInfo'); if(!el) return;
      const used = est && est.usage ? ` · בשימוש: ${(est.usage/1048576).toFixed(1)}MB מתוך ${(est.quota/1048576/1024).toFixed(1)}GB` : '';
      el.textContent = 'שיטת אחסון: ' + (names[Store.name()] || Store.name()) + used;
      if(Store.name()==='memory') el.style.color = '#B23A3A';
    });
  }
  const installBtn = document.getElementById('installBtn');
  if(installBtn) installBtn.addEventListener('click', doInstall);
}

/* ---------- Speech recognition ---------- */
let recog = null;
function startListening(){
  if(!SR) return;
  if(game.listening) return;
  try{
    recog = new SR();
    recog.lang='he-IL'; recog.interimResults=false; recog.maxAlternatives=5;
    game.listening = true; game.feedback='מקשיבים...'; render();
    AudioManager.setListening(true);
    AudioManager.playSfx('speech.listeningReady');
    recog.onspeechstart = ()=> AudioManager.setChildSpeaking(true);
    recog.onresult = e=>{
      const target = plain(game.pool[game.i].word);
      const heard = [...e.results[0]].map(r=>r.transcript.trim());
      const ok = heard.some(h=>{
        const a = h.replace(/[^\u05D0-\u05EA ]/g,'');
        return a.includes(target) || target.includes(a) || levenshtein(a,target)<=1;
      });
      game.listening=false;
      AudioManager.setChildSpeaking(false); AudioManager.setListening(false);
      AudioManager.playSfx('speech.recognized');
      markSeen(game.catId, game.pool[game.i].word, !ok);
      if(ok){
        game.score++; chime(true); confetti(20);
        game.feedback='מעולה! שמענו אותך 🎉';
        learned.add(key(game.catId,game.pool[game.i].word)); saveProgress();
        setTimeout(()=>{ if(!alive('speech')) return; game.i++; if(game.i>=game.pool.length){ game.done=true; AudioManager.playSfx('game.levelComplete'); } game.feedback=''; render(); }, 1200);
      }else{
        chime(false); game.feedback='שמענו "'+heard[0]+'" — ננסה שוב?';
      }
      render();
    };
    recog.onerror = ()=>{ game.listening=false; AudioManager.setChildSpeaking(false); AudioManager.setListening(false); game.feedback='לא הצלחנו לשמוע. ננסה שוב?'; render(); };
    recog.onend = ()=>{ if(game && game.listening){ game.listening=false; AudioManager.setChildSpeaking(false); AudioManager.setListening(false); render(); } };
    recog.start();
  }catch(e){ game.listening=false; AudioManager.setChildSpeaking(false); AudioManager.setListening(false); game.feedback='המיקרופון לא זמין'; render(); }
}
function levenshtein(a,b){
  const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}

/* ---------- Temptation helpers ---------- */
function openJar(){
  if(!game || game.opened) return;
  game.opened = true; chime(true); confetti(22);
  const it = game.pool[game.i];
  const k = key(game.catId, it.word);
  if(!learned.has(k)){ learned.add(k); saveProgress(); }
  render();
  say(game.catId, it.word, {after:()=>setTimeout(()=>speakTTS('הִנֵּה '+plain(it.word)+'! '+plain(it.word),{}), 300)});
}
function listenForAnything(){
  if(!SR){ toast('אין זיהוי דיבור בדפדפן הזה — אפשר ללחוץ "לפתוח"'); return; }
  if(game.listening) return;
  try{
    const r = new SR();
    r.lang='he-IL'; r.interimResults=true;
    game.listening = true; render();
    AudioManager.setListening(true);
    AudioManager.playSfx('speech.listeningReady');
    const finish = ()=>{
      game.listening=false;
      AudioManager.setChildSpeaking(false); AudioManager.setListening(false);
      AudioManager.playSfx('speech.finished');
      try{r.stop();}catch(e){} openJar();
    };
    r.onresult = finish;
    r.onspeechstart = ()=>{ AudioManager.setChildSpeaking(true); finish(); };
    r.onerror = ()=>{ game.listening=false; AudioManager.setChildSpeaking(false); AudioManager.setListening(false); render(); };
    r.onend = ()=>{ if(game && game.listening){ game.listening=false; AudioManager.setChildSpeaking(false); AudioManager.setListening(false); render(); } };
    r.start();
    setTimeout(()=>{ if(game && game.listening){ game.listening=false; AudioManager.setChildSpeaking(false); AudioManager.setListening(false); try{r.stop();}catch(e){} render(); } }, 8000);
  }catch(e){ game.listening=false; toast('המיקרופון לא זמין'); render(); }
}

/* ---------- Recording ---------- */
let mediaRec = null;
async function preloadRecs(catId){
  const cat = getCat(catId); if(!cat) return;
  await Promise.all(cat.items.map(async it=>{
    const k = key(catId,it.word);
    if(recordings[k]===undefined) recordings[k] = await sGet(K.rec(k)) || null;
  }));
}
async function recordWord(catId, word){
  const status = document.getElementById('recStatus');
  if(!window.MediaRecorder || !navigator.mediaDevices){
    toast('הדפדפן הזה לא תומך בהקלטה'); return;
  }
  if(mediaRec && mediaRec.state==='recording'){ mediaRec.stop(); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks = [];
    // Safari/iOS records mp4-aac, Chrome/Firefox webm-opus. Pick what the browser admits to.
    const candidates = ['audio/webm;codecs=opus','audio/webm','audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/aac','audio/ogg;codecs=opus'];
    const mime = (window.MediaRecorder && MediaRecorder.isTypeSupported)
      ? candidates.find(t=>MediaRecorder.isTypeSupported(t)) : null;
    mediaRec = mime ? new MediaRecorder(stream, {mimeType: mime}) : new MediaRecorder(stream);
    mediaRec.ondataavailable = e=>chunks.push(e.data);
    mediaRec.onstop = async ()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(chunks, {type: (mediaRec && mediaRec.mimeType) || mime || 'audio/webm'});
      const dataUrl = await blobToDataURL(blob);
      const k = key(catId, word);
      const ok = await sSet(K.rec(k), dataUrl);
      recordings[k] = dataUrl;
      toast(ok ? 'ההקלטה נשמרה 🎙️' : 'ההקלטה נשמרה לפעילות הנוכחית בלבד');
      render();
    };
    mediaRec.start();
    if(status){ status.style.display='block'; status.innerHTML = `<span class="rec-dot"></span> מקליטים את "${display(word)}"... לוחצים שוב על 🎙️ לסיום`; }
    setTimeout(()=>{ if(mediaRec && mediaRec.state==='recording') mediaRec.stop(); }, 4000);
  }catch(e){ toast('אין גישה למיקרופון'); }
}
function blobToDataURL(blob){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob); });
}

/* ---------- Custom words ---------- */
let pendingPhoto = null;
function handlePhoto(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const size = 320, c = document.createElement('canvas');
      c.width=c.height=size;
      const ctx = c.getContext('2d');
      const s = Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
      pendingPhoto = c.toDataURL('image/jpeg',0.72);
      const prev = document.getElementById('cwPreview');
      if(prev) prev.innerHTML = `<img src="${pendingPhoto}" style="width:56px;height:56px;object-fit:cover;border-radius:14px;border:2px solid var(--line)">`;
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
async function addCustomWord(){
  const wordEl = document.getElementById('cwWord'), emojiEl = document.getElementById('cwEmoji');
  const word = wordEl.value.trim();
  if(!word){ toast('צריך להקליד מילה'); return; }
  const item = { id:'cw'+Date.now(), word, emoji:(emojiEl.value.trim()||'💜'), photo:pendingPhoto||null };
  custom.push(item);
  await sSet(K.custom(item.id), item);
  await sSet(K.customIndex, custom.map(c=>c.id));
  pendingPhoto = null;
  toast('המילה נוספה 💜');
  render();
}

/* ---------- Install / PWA ---------- */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt = e; });
function doInstall(){
  if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt=null; }
  else toast('פתחו את תפריט הדפדפן ובחרו "הוספה למסך הבית"');
}
/* the manifest and service worker are real files now — see manifest.json / sw.js */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound', ()=>{
        const sw = reg.installing;
        if(!sw) return;
        sw.addEventListener('statechange', ()=>{
          if(sw.state === 'installed' && navigator.serviceWorker.controller){
            toast('יש גרסה חדשה — סגרו ופתחו מחדש');
          }
        });
      });
    }).catch(()=>{});
  });
}

/* ---------- Header buttons ---------- */
/* single source of truth for --barh: guarded so it only ever touches the
   DOM when the measured height actually changed, instead of writing (and
   thereby re-triggering the ResizeObserver below) on every single resize
   tick regardless of whether anything moved. */
let lastBarH = null;
function syncBarHeight(){
  const bar = document.querySelector('.topbar');
  if(!bar) return;
  const h = Math.round(bar.getBoundingClientRect().height);
  if(h === lastBarH) return;
  lastBarH = h;
  document.documentElement.style.setProperty('--barh', h+'px');
}
window.addEventListener('resize', syncBarHeight);
window.addEventListener('orientationchange', ()=>setTimeout(syncBarHeight,120));
if(window.visualViewport) window.visualViewport.addEventListener('resize', syncBarHeight);
if(window.ResizeObserver){
  try{ new ResizeObserver(syncBarHeight).observe(document.querySelector('.topbar')); }catch(e){}
}

function syncSpeedIcon(){
  document.getElementById('speedBtn').textContent = settings.rate<=0.6 ? '🐢' : settings.rate>=1 ? '⚡' : '🐇';
}
document.getElementById('musicBtn').addEventListener('click', ()=> setMusic(!settings.music));
document.getElementById('speedBtn').addEventListener('click', ()=>{
  settings.rate = settings.rate<=0.6 ? 0.85 : settings.rate<1 ? 1 : 0.6;
  saveSettings(); syncSpeedIcon();
  speakTTS('שלום',{});
});
let holdTimer = null, holdFired = false;
const pBtn = document.getElementById('parentBtn');
const startHold = ()=>{
  holdFired = false;
  holdTimer = setTimeout(()=>{
    holdFired = true;
    view='parent'; parentTab='settings';
    render();
    preloadRecs(activeCat||'animals').then(()=>{ if(view==='parent') render(); });
  }, 900);
};
const cancelHold = ()=> clearTimeout(holdTimer);
['mousedown','touchstart'].forEach(ev=>pBtn.addEventListener(ev, startHold, {passive:true}));
['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>pBtn.addEventListener(ev, cancelHold));
pBtn.addEventListener('click', ()=>{ if(!holdFired) toast('להורים: לחיצה ארוכה על הכפתור'); });

/* ---------- start gate: the one gesture iOS needs to unlock audio ----------
   Safari blocks AudioContext and speechSynthesis until a real user gesture.
   Without this the first word is silent and nothing explains why.        */
function unlockAudio(){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    g.gain.value = 0.0001; o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + 0.02);
  }catch(e){}
  try{
    if(speechOk){
      const warm = new SpeechSynthesisUtterance(' ');
      warm.volume = 0; warm.lang = 'he-IL';
      window.speechSynthesis.speak(warm);
      pickVoice();
    }
  }catch(e){}
}
async function keepAwake(){
  try{ if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }catch(e){}
}
function lockPortrait(){
  try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(()=>{}); }catch(e){}
}

/* AdMob only runs inside the Capacitor Android/iOS wrapper — never in the browser PWA.
   Uses Google sample ad units until you paste real IDs from https://admob.google.com
   Requests are tagged child-directed + G-rated + non-personalized (COPPA). */
const ADMOB = {
  banner: 'ca-app-pub-3940256099942544/6300978111'
};
function nativeAdMob(){
  const Cap = window.Capacitor;
  if(!Cap || typeof Cap.isNativePlatform !== 'function' || !Cap.isNativePlatform()) return null;
  if(Cap.Plugins && Cap.Plugins.AdMob) return Cap.Plugins.AdMob;
  if(typeof Cap.registerPlugin === 'function') return Cap.registerPlugin('AdMob');
  return null;
}
async function startAds(){
  const AdMob = nativeAdMob();
  if(!AdMob) return;
  try{
    await AdMob.initialize({
      tagForChildDirectedTreatment: true,
      maxAdContentRating: 'General'
    });
    if(typeof AdMob.addListener === 'function'){
      AdMob.addListener('bannerAdSizeChanged', size => {
        const h = size && (size.height || size.adHeight);
        if(h) document.documentElement.style.setProperty('--ad-h', h+'px');
      });
    }
    await AdMob.showBanner({
      adId: ADMOB.banner,
      adSize: 'ADAPTIVE_BANNER',
      position: 'BOTTOM_CENTER',
      margin: 0,
      npa: true
    });
    document.body.classList.add('has-ad');
    if(!document.documentElement.style.getPropertyValue('--ad-h')){
      document.documentElement.style.setProperty('--ad-h', '50px');
    }
  }catch(e){ console.warn('AdMob', e); }
}
async function polishNativeShell(){
  const Cap = window.Capacitor;
  if(!Cap || typeof Cap.isNativePlatform !== 'function' || !Cap.isNativePlatform()) return;
  const plugins = Cap.Plugins || {};
  try{
    if(plugins.StatusBar && plugins.StatusBar.setStyle) await plugins.StatusBar.setStyle({style:'DARK'});
    if(plugins.StatusBar && plugins.StatusBar.setBackgroundColor) await plugins.StatusBar.setBackgroundColor({color:'#FFF8EA'});
  }catch(e){}
  try{
    if(plugins.SplashScreen && plugins.SplashScreen.hide) await plugins.SplashScreen.hide();
  }catch(e){}
}

document.getElementById('gateMascot').innerHTML = mascot('wave', 190);
document.getElementById('gateBtn').addEventListener('click', ()=>{
  unlockAudio();
  AudioManager.unlock();
  keepAwake();
  lockPortrait();
  if(settings.music) startMusic();
  startAds();
  const g = document.getElementById('gate');
  g.style.transition = 'opacity .3s'; g.style.opacity = '0';
  setTimeout(()=>g.remove(), 320);
  const params = new URLSearchParams(location.search);
  const g2 = params.get('game');
  if(g2) launch(g2, activeCat);
});
// re-arm the wake lock when coming back from the lock screen
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') keepAwake(); });

/* ---------- generic UI tap sounds (single delegated listener, no per-button wiring) ----------
   Answer elements (.tile/.opt/.mem/.match-item/.box) already get semantic correct/retry/match
   sounds from chime() — skipped here to avoid stacking a tap sound on top of that feedback. */
document.addEventListener('click', e=>{
  if(e.target.closest('[data-nav]')){ AudioManager.playSfx('ui.backOrClose'); return; }
  if(e.target.closest('.tile, .opt, .mem, .match-item, .box')) return;
  if(e.target.closest('.card-nav')){ AudioManager.playSfx('ui.swipe'); return; }
  if(e.target.closest('.big-btn, .cat-card, .game-card, #gateBtn')){ AudioManager.playSfx('ui.primaryTap'); return; }
  if(e.target.closest('.pill-btn, .icon-btn, .switch, .seg button, button')){ AudioManager.playSfx('ui.secondaryTap'); }
}, true);

/* ---------- toddler-proofing ---------- */
document.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('gesturestart', e=>e.preventDefault());
let lastTouch = 0;
document.addEventListener('touchend', e=>{
  const now = Date.now();
  if(now - lastTouch < 320) e.preventDefault();   // kill double-tap zoom on iOS
  lastTouch = now;
}, {passive:false});

/* ---------- responsive helpers ---------- */
window.addEventListener('resize', ()=>{ if(view==='bubbles') render(); });
window.addEventListener('orientationchange', ()=> setTimeout(render, 250));
syncBarHeight();

/* keyboard support (desktop): arrows move flashcards, space/enter speaks, Esc goes home */
document.addEventListener('keydown', e=>{
  if(view==='cards'){
    const cat = getCat(activeCat); if(!cat) return;
    if(e.key==='ArrowLeft' || e.key==='ArrowRight'){
      e.preventDefault();
      cardIdx = (cardIdx + (e.key==='ArrowLeft'?1:-1) + cat.items.length) % cat.items.length;
      render(); say(cat.id, cat.items[cardIdx].word);
    } else if(e.key===' ' || e.key==='Enter'){
      e.preventDefault(); say(cat.id, cat.items[cardIdx].word);
    }
  }
  if(e.key==='Escape' && view!=='home'){ view='home'; game=null; render(); }
});

loadAll().then(()=>{
  syncBarHeight(); syncSpeedIcon(); syncMusicIcon();
  polishNativeShell();
  AudioManager.setMusicEnabled(settings.music);
  AudioManager.setSfxEnabled(settings.sounds);
  AudioManager.setVoiceEnabled(settings.voice);
  AudioManager.setMusicVolumeMultiplier(settings.musicVol);
  if(settings.music){
    const kick = ()=>{ startMusic(); document.removeEventListener('pointerdown', kick); };
    document.addEventListener('pointerdown', kick, {once:true});
  }
});
</script>
