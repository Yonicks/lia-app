<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FFF8EA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Talki">
<title>Talki</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- iOS launch images: without these the app opens on a blank white screen -->
<link rel="apple-touch-startup-image" href="splash/splash-1290x2796.png"
      media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="splash/splash-1179x2556.png"
      media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="splash/splash-1170x2532.png"
      media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="splash/splash-1640x2360.png"
      media="(device-width:820px) and (device-height:1180px) and (-webkit-device-pixel-ratio:2)">
<link rel="apple-touch-startup-image" href="splash/splash-1536x2048.png"
      media="(device-width:768px) and (device-height:1024px) and (-webkit-device-pixel-ratio:2)">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- Talki V2 design tokens ---- */
    --cream:#FFF8EA; --paper:#FFFFFF; --ink:#3A2A52; --ink-soft:#7B6E8C;
    --berry:#FF8FA8; --berry-dark:#E85E85; --sun:#FFD75A; --sun-dark:#E8B93A;
    --leaf:#8FD3C1; --leaf-dark:#4FA893; --sky:#6FA3DE; --sky-dark:#3D78B5;
    --grape:#7C4CD6; --grape-dark:#6D3BA6; --clay:#FFCDA1; --clay-dark:#F0A868;
    --teal:#6FC2B4; --teal-dark:#3D8F82;
    --wood:#8B5FC9; --wood-dark:#6D3BA6;
    --line:#F1E4CE; --shadow:0 10px 24px rgba(109,59,166,.12),0 2px 6px rgba(58,42,82,.06);
    /* V2 palette (referenced directly by new components) */
    --v2-purple:#6D3BA6; --v2-purple-bright:#7C4CD6; --v2-mint:#8FD3C1;
    --v2-peach:#FFCDA1; --v2-gold:#FFD75A; --v2-pink:#FFD9E6; --v2-pink-dark:#F2A8C4;
    --v2-radius-card:18px; --v2-radius-btn:16px; --v2-radius-hero:24px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overscroll-behavior:none}
  html{-webkit-text-size-adjust:100%}
  body{
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    background:var(--cream);
    background-image:radial-gradient(circle at 8% 12%,rgba(255,182,39,.16) 0,transparent 40%),
                     radial-gradient(circle at 92% 85%,rgba(138,92,199,.14) 0,transparent 42%);
    color:var(--ink);font-family:'Assistant','Heebo','Arial Hebrew','Segoe UI',system-ui,sans-serif;min-height:100vh;
    -webkit-tap-highlight-color:transparent;overflow-x:hidden;
    padding-top:env(safe-area-inset-top);
  }
  /* --barh is measured from the real top bar height by JS */
  :root{ --barh:70px; --ad-h:0px; }
  h1,h2,h3,.display,.focus-word,.prompt-word,.flashcard .word,.phrase-out{
    font-family:'Rubik','Heebo','Arial Hebrew','Segoe UI',system-ui,sans-serif}
  button{font-family:inherit;cursor:pointer}
  button:focus-visible,.tile:focus-visible{outline:3px solid var(--sky-dark);outline-offset:3px}

  .topbar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:3px solid var(--line);
    padding:clamp(8px,1.4vw,16px) clamp(12px,2.5vw,32px);
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .brand-text h1{font-size:clamp(.95rem,2.2vw,1.35rem)}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;overflow:hidden}
  .brand-text{min-width:0;overflow:hidden}
  .bar-right{flex:none}
  .brand-mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(155deg,var(--grape),var(--grape-dark));
    display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:var(--shadow);transform:rotate(-6deg);flex:none}
  .brand-text h1{margin:0;font-size:1.05rem;font-weight:900;color:var(--grape-dark);line-height:1.1;white-space:nowrap}
  .brand-text span{font-size:.68rem;color:var(--ink-soft);font-weight:600}
  @media(max-width:430px){
    .brand-text span{display:none}
    .brand-text h1{font-size:.84rem;line-height:1.12;white-space:normal;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .brand{flex:1;min-width:0;gap:7px}
    .brand-mark{width:34px;height:34px;border-radius:11px;font-size:17px}
    .topbar{padding:7px 9px;gap:5px}
    .icon-btn{width:36px;height:36px;font-size:15px;border-radius:10px}
    .progress-pill{padding:3px 7px;gap:5px}
    .progress-ring{width:24px;height:24px}
    .progress-pill b{font-size:.74rem}
    .progress-pill small{display:none}
  }
  .bar-right{display:flex;align-items:center;gap:7px}
  .progress-pill{display:none}
  .progress-ring{width:28px;height:28px}
  .progress-pill b{font-size:.82rem}
  .progress-pill small{display:block;font-size:.6rem;color:var(--ink-soft);font-weight:600}
  .icon-btn{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--paper);
    display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 3px 0 rgba(51,38,61,.08);flex:none}
  .icon-btn:active{transform:translateY(2px);box-shadow:none}

  main{max-width:1080px;margin:0 auto;padding:18px 14px calc(70px + env(safe-area-inset-bottom) + var(--ad-h,0px));
    padding-inline:max(14px,env(safe-area-inset-left),env(safe-area-inset-right))}
  @media(min-width:768px){ main{max-width:940px;padding:24px 22px 80px} }
  @media(min-width:1100px){ main{max-width:1180px;padding:28px 28px 90px} }
  @media(min-width:1500px){ main{max-width:1360px} }

  .hero{text-align:center;margin:6px 0 18px}
  .hero h2{font-size:clamp(1.35rem,3.4vw,2.2rem);margin:0 0 4px;font-weight:800}
  .hero p{margin:0;color:var(--ink-soft);font-weight:600;font-size:clamp(.85rem,1.7vw,1.1rem)}

  .section-label{display:flex;align-items:center;gap:8px;margin:26px 4px 12px;font-weight:900;font-size:1.05rem}
  .section-label::after{content:"";flex:1;height:3px;background:var(--line);border-radius:2px}

  .grid-home{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(150px,42vw,250px),1fr));
    gap:clamp(10px,1.6vw,20px)}
  .cat-card{position:relative;border:3px solid var(--line);text-align:start;overflow:hidden;border-radius:24px;padding:18px;
    color:var(--ink);background:var(--paper);box-shadow:var(--shadow);transition:transform .18s ease}
  .cat-card:active{transform:translateY(4px);box-shadow:none}
  .cat-card{padding:clamp(14px,1.8vw,26px)}
  .cat-card .name{font-size:clamp(1rem,2vw,1.5rem)}
  .cat-card .hero-chip{width:clamp(62px,12vw,88px);height:clamp(62px,12vw,88px);border-radius:22px;margin:0 0 10px;
    display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
  .cat-card .hero-chip img{width:76%;height:76%;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(58,46,77,.18))}
  .cat-card .name{font-size:1.2rem;font-weight:900;margin:0 0 9px}
  .bar-track{background:var(--cream);height:9px;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .bar-fill{height:100%;background:linear-gradient(155deg,var(--sun),var(--sun-dark));border-radius:999px;transition:width .4s ease}
  .cat-card .cap{display:flex;justify-content:space-between;margin-top:7px;font-size:.72rem;font-weight:700;color:var(--ink-soft)}
  .cat-card .stickers{position:absolute;top:12px;inset-inline-end:12px;font-size:.75rem;font-weight:800;background:var(--cream);
    color:var(--ink);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
  .c-animals .hero-chip{background:linear-gradient(155deg,var(--leaf),var(--leaf-dark))}
  .c-food .hero-chip{background:linear-gradient(155deg,var(--berry),var(--berry-dark))}
  .c-colors .hero-chip{background:linear-gradient(155deg,var(--grape),var(--grape-dark))}
  .c-home .hero-chip{background:linear-gradient(155deg,var(--sky),var(--sky-dark))}
  .c-family .hero-chip{background:linear-gradient(155deg,var(--clay),var(--clay-dark))}
  .c-body .hero-chip{background:linear-gradient(155deg,#D8567F,#A83560)}
  .c-actions .hero-chip{background:linear-gradient(155deg,var(--teal),var(--teal-dark))}
  .c-numbers .hero-chip{background:linear-gradient(155deg,var(--sun),var(--sun-dark))}
  .c-outside .hero-chip{background:linear-gradient(155deg,#4FA3D1,#2E6E96)}
  .c-emotions .hero-chip{background:linear-gradient(155deg,var(--wood),var(--wood-dark))}
  .c-mine .hero-chip{background:linear-gradient(155deg,var(--grape),var(--grape-dark))}
  .c-emotions{background:linear-gradient(155deg,#C9599E,#973576)}
  .c-mine{background:linear-gradient(155deg,#7A8CD0,#4E5FA6)}

  .games-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(150px,42vw,270px),1fr));
    gap:clamp(10px,1.6vw,18px)}
  .game-card{background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:16px 14px;text-align:start;
    box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
  .game-card:active{transform:translateY(3px);box-shadow:none}
  .game-card .gi{font-size:32px;flex:none}
  .game-card b{display:block;font-size:1rem;font-weight:900}
  .game-card small{color:var(--ink-soft);font-weight:600;font-size:.78rem}

  /* ---- per-screen scenic backdrops (illustrated game environments) ---- */
  body[data-view]{background-repeat:no-repeat;background-position:top center;background-size:cover;
    background-image:linear-gradient(180deg,rgba(255,248,234,.6),rgba(255,248,234,.96) 45%)}
  body[data-view="home"]{background-image:linear-gradient(180deg,rgba(255,248,234,.35),rgba(255,248,234,.97) 40%),url('assets/v2/backgrounds/talki-bg-home-hero.png')}
  body[data-view="category"]{background-image:linear-gradient(180deg,rgba(255,248,234,.4),rgba(255,248,234,.97) 38%),url('assets/v2/backgrounds/talki-bg-category-header.png')}
  body[data-view="practice"]{background-image:linear-gradient(180deg,rgba(255,248,234,.4),rgba(255,248,234,.97) 38%),url('assets/v2/backgrounds/talki-bg-practice-header.png')}
  body[data-view="games"]{background-image:linear-gradient(180deg,rgba(255,248,234,.4),rgba(255,248,234,.97) 38%),url('assets/v2/backgrounds/talki-bg-games-header.png')}
  body[data-view="stickers"]{background-image:linear-gradient(180deg,rgba(255,248,234,.4),rgba(255,248,234,.97) 38%),url('assets/v2/backgrounds/talki-bg-stickers-header.png')}
  body[data-view="quiz"]{background-image:linear-gradient(180deg,rgba(255,248,234,.6),rgba(255,248,234,.95) 55%),url('assets/v2/games/talki-game-quiz-background.png')}
  body[data-view="memory"]{background-image:linear-gradient(180deg,rgba(255,248,234,.6),rgba(255,248,234,.95) 55%),url('assets/v2/games/talki-game-memory-background.png')}
  body[data-view="missing"]{background-image:linear-gradient(180deg,rgba(255,248,234,.6),rgba(255,248,234,.95) 55%),url('assets/v2/games/talki-game-missing-item-background.png')}
  body[data-view="match"]{background-image:linear-gradient(180deg,rgba(255,248,234,.6),rgba(255,248,234,.95) 55%),url('assets/v2/games/talki-game-matching-background.png')}
  body[data-view="cards"]{background-image:linear-gradient(180deg,rgba(255,248,234,.6),rgba(255,248,234,.95) 55%),url('assets/v2/games/talki-game-flashcards-background.png')}
  body[data-view="bubbles"]{background-image:linear-gradient(180deg,rgba(255,248,234,.55),rgba(255,248,234,.93) 55%),url('assets/v2/games/talki-game-matching-background.png')}
  body[data-view="sounds"]{background-image:linear-gradient(180deg,rgba(255,248,234,.6),rgba(255,248,234,.95) 55%),url('assets/v2/games/talki-game-animal-sounds-background.png')}
  body[data-view="count"]{background-image:linear-gradient(180deg,rgba(255,248,234,.6),rgba(255,248,234,.95) 55%),url('assets/v2/games/talki-game-counting-background.png')}
  body[data-view="sort"]{background-image:linear-gradient(180deg,rgba(255,248,234,.6),rgba(255,248,234,.95) 55%),url('assets/v2/games/talki-game-sorting-background.png')}
  body[data-view="focus"]{background-image:linear-gradient(180deg,rgba(255,248,234,.6),rgba(255,248,234,.95) 55%),url('assets/v2/speech/talki-speech-background-focus-word.png')}
  body[data-view="receptive"]{background-image:linear-gradient(180deg,rgba(255,248,234,.6),rgba(255,248,234,.95) 55%),url('assets/v2/speech/talki-speech-background-show-me.png')}
  body[data-view="cloze"]{background-image:linear-gradient(180deg,rgba(255,248,234,.6),rgba(255,248,234,.95) 55%),url('assets/v2/speech/talki-speech-background-fill-sentence.png')}
  body[data-view="temptation"]{background-image:linear-gradient(180deg,rgba(255,248,234,.6),rgba(255,248,234,.95) 55%),url('assets/v2/speech/talki-speech-background-repetition-jar.png')}
  body[data-view="pairs"]{background-image:linear-gradient(180deg,rgba(255,248,234,.6),rgba(255,248,234,.95) 55%),url('assets/v2/speech/talki-speech-background-minimal-pairs.png')}
  body[data-view="combine"]{background-image:linear-gradient(180deg,rgba(255,248,234,.6),rgba(255,248,234,.95) 55%),url('assets/v2/speech/talki-speech-background-two-word.png')}
  body[data-view="speech"]{background-image:linear-gradient(180deg,rgba(255,248,234,.6),rgba(255,248,234,.95) 55%),url('assets/v2/speech/talki-speech-background-show-me.png')}

  .cat-header{position:sticky;top:var(--barh,68px);z-index:20;background:var(--cream);padding:8px 2px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .pill-btn{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--paper);
    border-radius:999px;padding:8px 14px;font-weight:800;font-size:.88rem;box-shadow:0 3px 0 rgba(51,38,61,.08)}
  .pill-btn:active{transform:translateY(2px);box-shadow:none}
  .pill-btn.accent{background:linear-gradient(155deg,var(--sun),var(--sun-dark));color:#fff;border:none}
  .pill-btn.blue{background:linear-gradient(155deg,var(--sky),var(--sky-dark));color:#fff;border:none}
  .cat-title{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.15rem}

  .word-grid{display:grid;gap:clamp(9px,1.3vw,16px);
    grid-template-columns:repeat(auto-fill,minmax(clamp(130px,40vw,190px),1fr))}
  .tile{position:relative;background:var(--paper);border:3px solid var(--line);border-radius:22px;
    padding:15px 9px 13px;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:var(--shadow);
    transition:transform .15s ease,border-color .15s ease}
  .tile .emoji{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1}
  .tile .photo{width:clamp(68px,9vw,104px);height:clamp(68px,9vw,104px);object-fit:cover;border-radius:18px;border:2px solid var(--line)}
  .tile .art{width:clamp(72px,10vw,112px);height:clamp(72px,10vw,112px);object-fit:contain}
  img.art{object-fit:contain;border:none;border-radius:0;background:transparent;display:block;margin:0 auto}
  .tile .word{font-weight:800;font-size:clamp(.95rem,1.6vw,1.25rem);text-align:center;line-height:1.25}
  .tile .speaker{position:absolute;top:8px;inset-inline-end:8px;opacity:.45;width:18px;height:18px}
  .tile.learned{border-color:var(--sun)}
  .tile .sticker{position:absolute;top:-8px;inset-inline-start:-8px;font-size:1.3rem;filter:drop-shadow(0 2px 0 rgba(0,0,0,.1))}
  .tile.pop{transform:scale(1.08) rotate(-2deg);border-color:var(--berry)}

  .card-stage{max-width:min(560px,92vw);margin:0 auto;text-align:center}
  .flashcard{background:var(--paper);border:4px solid var(--line);border-radius:32px;padding:36px 20px;
    box-shadow:var(--shadow);touch-action:pan-y;user-select:none}
  .flashcard .emoji{font-size:clamp(5rem,18vh,10rem);line-height:1;display:block}
  .flashcard img{width:clamp(160px,26vh,270px);height:clamp(160px,26vh,270px);object-fit:cover;border-radius:26px;border:3px solid var(--line)}
  .flashcard img.art{width:clamp(180px,30vh,300px);height:clamp(180px,30vh,300px);border:none;border-radius:0}
  .flashcard .word{font-size:clamp(1.7rem,4.5vw,3rem);font-weight:900;margin-top:14px;font-family:'Rubik',sans-serif}
  .card-nav{display:flex;justify-content:center;gap:12px;margin-top:16px;align-items:center}
  .hint{color:var(--ink-soft);font-weight:600;font-size:.82rem;margin-top:10px}

  .quiz-stats{display:flex;justify-content:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
  .stat-chip{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:5px 13px;font-weight:800;font-size:.82rem}
  .prompt-box{background:var(--paper);border:3px solid var(--line);border-radius:24px;
    padding:clamp(14px,2vh,26px);max-width:min(560px,94vw);margin:0 auto 18px;box-shadow:var(--shadow);text-align:center}
  .prompt-box p{margin:0 0 12px;font-weight:700;color:var(--ink-soft);font-size:.92rem}
  .prompt-word{font-size:2rem;font-weight:900;font-family:'Rubik',sans-serif;margin:0 0 10px}
  .big-btn{border:none;border-radius:999px;padding:11px 24px;font-weight:800;font-size:.95rem;color:#fff}
  .b-sky{background:linear-gradient(155deg,var(--sky),var(--sky-dark));box-shadow:0 4px 0 var(--sky-dark)}
  .b-berry{background:linear-gradient(155deg,var(--berry),var(--berry-dark));box-shadow:0 4px 0 var(--berry-dark)}
  .b-leaf{background:linear-gradient(155deg,var(--leaf),var(--leaf-dark));box-shadow:0 4px 0 var(--leaf-dark)}
  .b-grape{background:linear-gradient(155deg,var(--grape),var(--grape-dark));box-shadow:0 4px 0 var(--grape-dark)}
  .b-wood{background:linear-gradient(155deg,var(--wood),var(--wood-dark));box-shadow:0 4px 0 var(--wood-dark)}
  .big-btn:active{transform:translateY(3px);box-shadow:none}
  .reward-star{width:clamp(34px,7vw,46px);height:clamp(34px,7vw,46px);object-fit:contain;margin:0 2px;filter:drop-shadow(0 2px 0 rgba(58,46,77,.15))}

  .opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(10px,1.5vw,18px);
    max-width:min(680px,94vw);margin:0 auto}
  .opt{background:var(--paper);border:3px solid var(--line);border-radius:22px;
    padding:clamp(16px,2.4vh,32px) 10px;font-size:clamp(2.4rem,7vh,4rem);
    box-shadow:var(--shadow);transition:transform .12s ease}
  .opt img{width:clamp(70px,10vh,120px);height:clamp(70px,10vh,120px);object-fit:cover;border-radius:16px}
  .opt img.art{width:clamp(86px,13vh,150px);height:clamp(86px,13vh,150px);border-radius:0}
  .opt:active{transform:translateY(3px)}
  .opt.correct{border-color:var(--leaf);background:#EAFBF2;animation:pulse .5s ease}
  .opt.wrong{border-color:var(--berry);animation:shake .4s ease}
  .opt.gone{opacity:0;pointer-events:none;transition:opacity .5s ease}

  .mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.2vw,14px);
    max-width:min(620px,94vw);margin:0 auto}
  .mem{aspect-ratio:1;border-radius:18px;border:3px solid var(--line);font-size:clamp(1.4rem,4vw,2.4rem);background:linear-gradient(155deg,var(--grape),var(--grape-dark));
    color:#fff;font-size:1.7rem;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
    font-weight:900;padding:4px;overflow:hidden}
  .mem.open{background:var(--paper);color:var(--ink);font-size:1.9rem}
  .mem.open.text{font-size:.82rem;line-height:1.15;font-family:'Rubik',sans-serif}
  .mem.matched{background:#EAFBF2;border-color:var(--leaf);color:var(--ink)}
  .mem img{width:100%;height:100%;object-fit:cover;border-radius:12px}
  .mem img.art{width:82%;height:82%}

  .match-cols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.6vw,20px);
    max-width:min(640px,94vw);margin:0 auto}
  .match-item{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:12px 8px;
    font-weight:800;font-size:1rem;box-shadow:0 4px 0 rgba(51,38,61,.1);min-height:64px;
    display:flex;align-items:center;justify-content:center}
  .match-item .em{font-size:2.1rem}
  .match-item img{width:52px;height:52px;object-fit:cover;border-radius:12px}
  .match-item img.art{width:58px;height:58px;border-radius:0}
  .match-item.sel{border-color:var(--sky);background:#EAF6FD}
  .match-item.done{border-color:var(--leaf);background:#EAFBF2;opacity:.55;pointer-events:none}

  .done-card{background:var(--paper);border:3px solid var(--sun);border-radius:26px;padding:32px 20px;max-width:430px;
    margin:20px auto;box-shadow:var(--shadow);text-align:center;position:relative}
  .done-card .big{font-size:2.8rem;margin-bottom:6px}
  .done-card h3{margin:0 0 6px;font-size:1.25rem}
  .done-card p{color:var(--ink-soft);font-weight:600;margin:0 0 16px}

  .panel{background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .panel h3{margin:0 0 12px;font-size:1.05rem}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:2px dashed #F3E7C6}
  .row:last-child{border-bottom:none}
  .row .lbl b{display:block;font-size:.95rem}
  .row .lbl small{color:var(--ink-soft);font-weight:600;font-size:.75rem}
  .switch{width:56px;height:32px;border-radius:999px;border:2px solid var(--line);background:#EFE6D2;position:relative;flex:none}
  .switch.on{background:var(--leaf);border-color:var(--leaf-dark)}
  .switch i{position:absolute;top:2px;inset-inline-start:2px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .18s ease}
  .switch.on i{inset-inline-start:26px}
  .seg{display:flex;gap:6px;background:#F5EBD6;padding:4px;border-radius:999px}
  .seg button{border:none;background:transparent;padding:6px 12px;border-radius:999px;font-weight:800;font-size:.82rem;color:var(--ink-soft)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(51,38,61,.1)}

  input[type=text],select{width:100%;padding:11px 14px;border-radius:14px;border:2px solid var(--line);
    background:var(--cream);font-family:inherit;font-weight:700;font-size:1rem;color:var(--ink)}
  label.field{display:block;margin-bottom:10px;font-weight:800;font-size:.85rem;color:var(--ink-soft)}
  .file-btn{display:inline-flex;align-items:center;gap:8px;border:2px dashed var(--line);background:var(--cream);
    border-radius:14px;padding:11px 16px;font-weight:800;font-size:.88rem}
  .mini-list{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto;padding-inline-end:4px}
  .mini{display:flex;align-items:center;gap:10px;background:var(--cream);border:2px solid var(--line);
    border-radius:14px;padding:8px 12px}
  .mini .m-em{font-size:1.5rem}
  .mini img{width:38px;height:38px;object-fit:cover;border-radius:10px}
  .mini img.art{width:42px;height:42px;border-radius:0}
  .mini b{flex:1;font-size:.92rem}
  .tag{font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:999px;background:#EAFBF2;color:var(--leaf-dark)}
  .tag.warn{background:#FFEFE0;color:var(--clay-dark)}
  .tag.rec{background:#F0E9FB;color:var(--grape-dark)}

  .lock-wrap{max-width:340px;margin:40px auto;text-align:center}
  .lock-num{font-size:2.2rem;font-weight:900;font-family:'Rubik',sans-serif;margin:12px 0}
  .lock-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .lock-grid button{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:16px 0;
    font-size:1.3rem;font-weight:900;box-shadow:var(--shadow)}

  .banner{background:#FFE7E7;color:#B23A3A;padding:11px 15px;border-radius:14px;font-weight:700;text-align:center;margin:10px 0}
  .note{background:#FFF8EA;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:600;
    font-size:.82rem;color:var(--ink-soft);margin-top:10px}

  .empty{text-align:center;padding:36px 16px;color:var(--ink-soft);font-weight:700}
  .empty .e-em{font-size:3rem;display:block;margin-bottom:10px}

  .toast{position:fixed;bottom:calc(22px + var(--ad-h,0px));inset-inline:0;width:max-content;max-width:calc(100vw - 28px);
    margin-inline:auto;background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-weight:800;font-size:.88rem;
    z-index:80;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}

  /* bubbles */
  .bubble-stage{position:relative;height:min(62dvh,560px);min-height:320px;max-width:min(900px,96vw);margin:0 auto;overflow:hidden;border:3px solid var(--line);
    border-radius:26px;background:linear-gradient(180deg,#E9F6FD,#F7FBFE);box-shadow:var(--shadow)}
  .bubble{position:absolute;bottom:-140px;border-radius:50%;border:3px solid rgba(255,255,255,.9);
    background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(120,200,240,.55));
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    box-shadow:0 6px 16px rgba(46,159,224,.28);animation:rise linear forwards;padding:6px}
  .bubble .b-em{font-size:1.9rem;line-height:1}
  .bubble .b-em img{width:40px;height:40px;object-fit:cover;border-radius:10px}
  .bubble .b-em img.art{width:46px;height:46px;border-radius:0}
  .bubble .b-w{font-size:.72rem;font-weight:900;color:#1D4E68;text-align:center;line-height:1.05}
  .bubble.pop-out{animation:popout .26s ease forwards}
  @keyframes rise{to{transform:translateY(-105vh) translateX(var(--drift,0px))}}
  @keyframes popout{to{transform:scale(1.5);opacity:0}}
  .count-stage{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:min(520px,94vw);margin:0 auto 18px;
    background:var(--paper);border:3px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}
  .count-stage span{font-size:2.6rem}
  .box-row{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,22px);max-width:min(560px,94vw);margin:0 auto}
  .box{border:3px dashed var(--line);border-radius:24px;padding:20px 10px;background:var(--paper);
    box-shadow:var(--shadow);font-weight:900}
  .box .bi{font-size:2.4rem;display:block;margin-bottom:6px}
  .box.correct{border-style:solid;border-color:var(--leaf);background:#EAFBF2;animation:pulse .5s ease}
  .box.wrong{border-color:var(--berry);animation:shake .4s ease}
  /* clinical games */
  .focus-card{background:var(--paper);border:4px solid var(--line);border-radius:30px;
    padding:clamp(20px,3vh,36px) 20px;max-width:min(560px,94vw);margin:0 auto;box-shadow:var(--shadow);text-align:center}
  .focus-card .em{font-size:clamp(4.5rem,16vh,9rem);line-height:1;display:block}
  .focus-card img{width:170px;height:170px;object-fit:cover;border-radius:24px;border:3px solid var(--line)}
  .focus-card img.art{width:210px;height:210px;border:none;border-radius:0}
  .prompt-box img.art{width:130px;height:130px}
  .count-stage img.art{width:56px;height:56px;display:inline-block;margin:4px}
  .focus-word{font-size:2.2rem;font-weight:900;font-family:'Rubik',sans-serif;margin:12px 0 4px}
  .focus-phrase{font-size:1.15rem;font-weight:700;color:var(--ink-soft)}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
  .dots i{width:11px;height:11px;border-radius:50%;background:#EFE6D2;display:block}
  .dots i.on{background:var(--berry)}
  .wait-face{font-size:4.5rem;animation:lean 1.6s ease-in-out infinite}
  @keyframes lean{50%{transform:scale(1.12) rotate(-4deg)}}
  .wait-ring{width:66px;height:66px;margin:8px auto}
  .jar{font-size:6.5rem;display:inline-block;animation:wiggle 1.4s ease-in-out infinite}
  @keyframes wiggle{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
  .jar.open{animation:burst .6s ease forwards}
  @keyframes burst{to{transform:scale(1.4) rotate(12deg);opacity:0}}
  .mod-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;max-width:min(560px,94vw);margin:0 auto 14px}
  .mod{background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:14px 8px;font-weight:900;
    font-size:1.1rem;box-shadow:var(--shadow)}
  .mod .mi{font-size:1.8rem;display:block}
  .mod img.art{width:48px;height:48px;margin-bottom:4px}
  .mod.sel{border-color:var(--grape);background:#F3EDFC}
  .phrase-out{font-size:1.6rem;font-weight:900;font-family:'Rubik',sans-serif;text-align:center;margin:14px 0;min-height:2rem;color:var(--grape-dark)}
  /* start gate: also the gesture that unlocks audio on iOS */
  .gate{position:fixed;inset:0;z-index:90;background:var(--cream) center/cover no-repeat url('assets/v2/backgrounds/talki-bg-home-hero.png');
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
  .gate::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,248,234,.4),rgba(255,248,234,.88) 75%)}
  .gate>*{position:relative}
  .gate h2{font-size:clamp(1.5rem,5vw,2.4rem);margin:0;color:var(--grape-dark);font-weight:900}
  .gate p{margin:0;color:var(--ink-soft);font-weight:700;max-width:22rem}
  .gate .mark{width:clamp(110px,26vw,170px);height:clamp(110px,26vw,170px);border-radius:34px;
    background:linear-gradient(155deg,var(--grape),var(--grape-dark));display:flex;align-items:center;justify-content:center;
    font-size:clamp(3.4rem,9vw,5rem);box-shadow:var(--shadow);transform:rotate(-6deg)}
  .gate button{border:none;border-radius:999px;padding:16px 44px;font-size:1.25rem;font-weight:900;color:#fff;
    background:linear-gradient(155deg,var(--wood),var(--wood-dark));box-shadow:0 6px 0 var(--wood-dark)}
  .gate button:active{transform:translateY(4px);box-shadow:none}
  /* ---- כּוֹכִי the mascot ---- */
  .mascot-wrap{display:inline-block;line-height:0}
  .mascot-wrap svg,.mascot-wrap img{width:100%;height:100%;overflow:visible;object-fit:contain}
  .mascot-idle{animation:float 3.4s ease-in-out infinite}
  .mascot-cheer{animation:jump .7s cubic-bezier(.3,1.6,.5,1) infinite}
  .mascot-listen{animation:tilt 1.8s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px) rotate(3deg)}}
  @keyframes jump{50%{transform:translateY(-16px) scale(1.06)}}
  @keyframes tilt{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}

  /* ---- category art: soft repeating shapes behind each card ---- */
  .cat-card::before{content:"";position:absolute;inset:0;background-image:var(--art);
    background-repeat:repeat;background-size:60px 60px;opacity:.9;pointer-events:none}
  .cat-banner::before{background-image:var(--art)}
  .cat-card > *{position:relative;z-index:1}
  .cat-banner{position:relative;overflow:hidden;border-radius:24px;padding:16px 18px;margin-bottom:14px;
    color:#fff;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
  .cat-banner::before{content:"";position:absolute;inset:0;background-repeat:repeat;background-size:60px 60px}
  .cat-banner .cb-text{position:relative;z-index:1}
  .cat-banner .cb-text b{display:block;font-size:1.3rem;font-family:'Rubik',sans-serif}
  .cat-banner .cb-text small{font-weight:700;opacity:.95;font-size:.82rem}
  .cat-banner .cb-mascot{position:relative;z-index:1;width:58px;height:58px;flex:none}

  /* ---- screen transitions ---- */
  @keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  #app{animation:screenIn .26s ease}
  @keyframes tileIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  .word-grid .tile{animation:tileIn .3s ease backwards}

  /* ---- celebration overlay ---- */
  .celebrate{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
    pointer-events:none;background:rgba(255,246,228,.55);animation:fadeIn .2s ease}
  .celebrate .box{background:var(--paper);border:4px solid var(--sun);border-radius:32px;padding:26px 34px;
    text-align:center;box-shadow:var(--shadow);animation:popIn .45s cubic-bezier(.3,1.6,.5,1)}
  .celebrate .box b{display:block;font-size:1.5rem;font-family:'Rubik',sans-serif;margin-top:8px}
  @keyframes fadeIn{from{opacity:0}}
  @keyframes popIn{from{transform:scale(.6);opacity:0}}

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
  .confetti span{position:absolute;top:-20px;font-size:1.4rem;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .rec-dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#E03131;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}

  /* ============ RESPONSIVE: phone → tablet → desktop ============ */

  /* ---- tablet (iPad portrait and up) ---- */
  @media(min-width:768px){
    .topbar{padding:16px 26px}
    .brand-mark{width:52px;height:52px;font-size:26px;border-radius:17px}
    .brand-text h1{font-size:1.4rem}
    .brand-text span{font-size:.82rem}
    .icon-btn{width:48px;height:48px;font-size:20px}
    .progress-pill{padding:7px 12px}
    .progress-ring{width:34px;height:34px}
    .progress-pill b{font-size:.95rem}
    .hero h2{font-size:2.2rem}
    .hero p{font-size:1.1rem}
    .section-label{font-size:1.25rem;margin:34px 4px 16px}
    .grid-home{grid-template-columns:repeat(3,1fr);gap:18px}
    .cat-card{padding:24px;border-radius:28px}
    .cat-card .glyph{font-size:56px}
    .cat-card .name{font-size:1.5rem}
    .games-row{grid-template-columns:repeat(3,1fr);gap:16px}
    .game-card{padding:20px 18px}
    .game-card .gi{font-size:40px}
    .game-card b{font-size:1.12rem}
    .game-card small{font-size:.88rem}
    .pill-btn{padding:11px 20px;font-size:1rem}
    .cat-title{font-size:1.5rem}
    .word-grid{gap:16px}
    .tile{padding:20px 12px 18px;border-radius:26px}
    .tile .emoji{font-size:3.4rem}
    .tile .photo{width:104px;height:104px}
    .tile .art{width:112px;height:112px}
    .tile .word{font-size:1.25rem}
    .card-stage{max-width:640px}
    .flashcard{padding:56px 30px}
    .flashcard .emoji{font-size:10rem}
    .flashcard img{width:290px;height:290px}
    .flashcard .word{font-size:3rem}
    .prompt-box,.done-card,.quiz-prompt{max-width:640px;padding:28px}
    .prompt-word{font-size:2.6rem}
    .opt-grid{max-width:720px;gap:18px}
    .opt{padding:30px 12px;font-size:4rem;border-radius:26px}
    .opt img{width:120px;height:120px}
    .mem-grid{max-width:680px;gap:14px}
    .mem{font-size:2.6rem;border-radius:22px}
    .mem.open{font-size:3rem}
    .mem.open.text{font-size:1.15rem}
    .match-cols{max-width:720px;gap:18px}
    .match-item{min-height:86px;font-size:1.3rem;border-radius:22px}
    .match-item .em{font-size:3rem}
    .match-item img{width:70px;height:70px}
    .stat-chip{font-size:1rem;padding:7px 17px}
    .big-btn{padding:13px 30px;font-size:1.08rem}
    .focus-card{max-width:620px;padding:40px 28px}
    .focus-card .em{font-size:9rem}
    .focus-card img{width:260px;height:260px}
    .focus-word{font-size:3rem}
    .focus-phrase{font-size:1.5rem}
    .box-row{max-width:640px}
    .box{padding:28px 14px;font-size:1.3rem}
    .box .bi{font-size:3.4rem}
    .mod-row{max-width:640px}
    .mod{font-size:1.3rem;padding:18px 10px}
    .phrase-out{font-size:2.2rem}
    .count-stage{max-width:620px}
    .count-stage span{font-size:3.6rem}
    .bubble-stage{height:58vh;min-height:420px}
    .panel{padding:24px}
    .lock-wrap{max-width:420px}
    .lock-grid button{padding:20px 0;font-size:1.5rem}
  }

  /* ---- desktop / iPad landscape ---- */
  @media(min-width:1100px){
    .grid-home{grid-template-columns:repeat(4,1fr)}
    .games-row{grid-template-columns:repeat(3,1fr)}
    .word-grid{grid-template-columns:repeat(6,1fr)}
    .opt-grid{max-width:820px}
    .card-stage{max-width:720px}
    .parent-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:18px;align-items:start}
    .parent-cols .panel{margin-bottom:0}
    /* pointer devices get hover feedback */
    .cat-card:hover,.game-card:hover{transform:translateY(-3px)}
    .tile:hover{border-color:var(--sun);transform:translateY(-3px)}
    .opt:hover,.mem:hover,.box:hover,.match-item:hover{transform:translateY(-3px)}
    .pill-btn:hover,.big-btn:hover{filter:brightness(1.05)}
  }
  @media(min-width:1500px){
    .word-grid{grid-template-columns:repeat(7,1fr)}
    .grid-home{grid-template-columns:repeat(5,1fr)}
  }

  /* ---- phone landscape: keep the stage visible ---- */
  @media(max-height:520px) and (orientation:landscape){
    .topbar{padding:8px 14px}
    .brand-text span{display:none}
    .brand-mark{width:34px;height:34px;font-size:17px}
    .hero{margin:2px 0 10px}
    .hero h2{font-size:1.2rem}
    .hero p{display:none}
    .grid-home{grid-template-columns:repeat(4,1fr)}
    .cat-card{padding:12px}
    .cat-card .glyph{font-size:30px;margin-bottom:4px}
    .cat-card .name{font-size:.95rem}
    .games-row{grid-template-columns:repeat(4,1fr)}
    .flashcard{padding:16px}
    .flashcard .emoji{font-size:4.4rem}
    .flashcard img{width:130px;height:130px}
    .flashcard .word{font-size:1.5rem;margin-top:6px}
    .opt{padding:12px 8px;font-size:2.2rem}
    .opt-grid{grid-template-columns:repeat(4,1fr)!important;max-width:none}
    .bubble-stage{height:74vh;min-height:220px}
    .focus-card{padding:16px}
    .focus-card .em{font-size:4rem}
    .focus-word{font-size:1.6rem}
    .word-grid{grid-template-columns:repeat(5,1fr)}
  }

  /* ---- keep tap targets finger-sized on touch, tighter on mouse ---- */
  @media(hover:none){ .tile,.opt,.mem,.box,.match-item{min-height:96px} }

  /* ---- device adaptations ---- */
  @media (pointer:coarse){
    .pill-btn{padding:11px 16px}
    .icon-btn{width:44px;height:44px}
    .opt,.tile,.mem,.box{touch-action:manipulation}
  }
  /* phone landscape: shorter chrome, side-by-side stage */
  @media (max-height:560px) and (orientation:landscape){
    .topbar{padding:6px 12px}
    .brand-text span{display:none}
    .hero{margin:2px 0 10px}
    .hero h2{font-size:1.15rem}
    .flashcard{padding:16px}
    .flashcard .emoji{font-size:4rem}
    .bubble-stage{height:56dvh;min-height:200px}
    .opt{padding:10px 8px;font-size:2.2rem}
    main{padding-bottom:30px}
  }
  /* tablet & up: roomier cards, three-across options */
  @media (min-width:760px){
    .quiz-stats .stat-chip{font-size:.92rem;padding:7px 16px}
    .cat-title{font-size:1.35rem}
    .panel{padding:22px}
  }
  /* desktop: wide layout, hover affordances, side-by-side parent panels */
  @media (min-width:1024px){
    .opt-grid{max-width:760px}
    .match-cols{max-width:760px}
    .parent-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
    .mini-list{max-height:420px}
  }
  @media (hover:hover) and (pointer:fine){
    .cat-card:hover{transform:translateY(-3px)}
    .game-card:hover,.tile:hover{border-color:var(--sun);transform:translateY(-2px)}
    .opt:hover,.mem:hover,.box:hover{filter:brightness(1.03)}
    .pill-btn:hover,.big-btn:hover{filter:brightness(1.05)}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important}
  }

  /* ================================================================
     TALKI V2 — bottom navigation, header banners, home/practice/games/
     stickers component system. Additive layer on top of the tokens
     above; existing screens (games, parent) inherit the new palette
     automatically through the redefined CSS variables.
  ================================================================ */
  main{padding-bottom:calc(78px + env(safe-area-inset-bottom) + var(--ad-h,0px))}
  @media(min-width:768px){ main{padding-bottom:calc(86px + var(--ad-h,0px))} }

  .bottom-nav{position:fixed;inset-inline:0;bottom:0;z-index:40;display:flex;justify-content:center;
    padding:0 max(10px,env(safe-area-inset-left)) env(safe-area-inset-bottom) max(10px,env(safe-area-inset-right));
    pointer-events:none}

  const src = MASCOT_IMG[mood] || MASCOT_IMG.idle;
  return `<span class="mascot-wrap mascot-${mood}" style="width:${size||96}px;height:${size||96}px"><img src="${src}" alt="" draggable="false"></span>`;
}
function micIcon(state, size){
  const file = state==='listening' || state===true ? 'talki-speech-microphone-listening.png'
    : state==='success' ? 'talki-speech-microphone-success.png'
    : state==='processing' ? 'talki-speech-microphone-processing.png'
    : state==='recording' ? 'talki-speech-microphone-recording.png'
    : 'talki-speech-microphone-normal.png';
  return `<img src="assets/v2/speech/${file}" alt="" style="width:${size||22}px;height:${size||22}px;object-fit:contain;vertical-align:middle">`;
}

/* ---------------------------------------------------------------
   Storage layer. One small async key/value interface, three
   backends tried in order:
     1. IndexedDB      — the real one: survives reloads, no size cap
                         worth worrying about, holds audio happily
     2. window.storage — the chat-artifact API, when running there
     3. memory         — last resort, so the app never crashes
   A future cloud sync only has to implement the same four calls.
---------------------------------------------------------------- */
const Store = (() => {
  const DB_NAME = 'lia-words', STORE = 'kv', VERSION = 1;
  let dbPromise = null, engine = 'memory';
  const mem = new Map();

  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      if(!('indexedDB' in window)) return reject(new Error('no indexedDB'));
      const req = indexedDB.open(DB_NAME, VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror   = () => reject(req.error);
      req.onblocked = () => reject(new Error('blocked'));
    });
    return dbPromise;
  }
  function tx(mode, fn){
    return openDB().then(db => new Promise((resolve, reject) => {
      const t = db.transaction(STORE, mode);
      const req = fn(t.objectStore(STORE));
      t.onerror = () => reject(t.error);
      t.oncomplete = () => resolve(req ? req.result : undefined);
    }));
  }

  const hasArtifactStore = () => typeof window.storage !== 'undefined' && window.storage;

  async function detect(){
    try{ await openDB(); engine = 'indexeddb'; return; }catch(e){}
    if(hasArtifactStore()){ engine = 'artifact'; return; }
    engine = 'memory';
  }

  async function get(key){
    try{
      if(engine==='indexeddb'){
        const v = await tx('readonly', st => st.get(key));
        return v === undefined ? null : v;
      }
      if(engine==='artifact'){
        const r = await window.storage.get(key, false);
        return r && r.value ? JSON.parse(r.value) : null;
      }
    }catch(e){}
    return mem.has(key) ? mem.get(key) : null;
  }
  async function set(key, val){
    mem.set(key, val);
    try{
      if(engine==='indexeddb'){ await tx('readwrite', st => st.put(val, key)); return true; }
      if(engine==='artifact'){ await window.storage.set(key, JSON.stringify(val), false); return true; }
    }catch(e){ return false; }
    return engine === 'memory';
  }
  async function del(key){
    mem.delete(key);
    try{
      if(engine==='indexeddb'){ await tx('readwrite', st => st.delete(key)); return; }
      if(engine==='artifact'){ await window.storage.delete(key, false); }
    }catch(e){}
  }
  async function keys(){
    try{
      if(engine==='indexeddb') return await tx('readonly', st => st.getAllKeys());
      if(engine==='artifact'){ const r = await window.storage.list('', false); return (r && r.keys) || []; }
    }catch(e){}
    return [...mem.keys()];
  }
  async function estimate(){
    try{
      if(navigator.storage && navigator.storage.estimate){
        const {usage, quota} = await navigator.storage.estimate();
        return {usage, quota};
      }
    }catch(e){}
    return null;
  }

  return { detect, get, set, del, keys, estimate, name: () => engine };
})();

const sGet = k => Store.get(k);

/* ---- backup: export / import the whole store as one JSON file ---- */
const BACKUP_VERSION = 1;

async function exportBackup(){
  const all = {};
  for(const k of await Store.keys()) all[k] = await Store.get(k);
  const payload = {
    app: 'talki',
    version: BACKUP_VERSION,
    exported_at: new Date().toISOString(),
    word_count: learned.size,
    data: all
  };
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `talki-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  settings.lastBackup = new Date().toISOString();
  await saveSettings();
  toast('גיבוי נשמר 💾');
  render();
}

async function importBackup(file, mode){
  let payload;
  try{ payload = JSON.parse(await file.text()); }
  catch(e){ toast('הקובץ אינו תקין'); return; }
  if(!payload || (payload.app !== 'talki' && payload.app !== 'lia-words') || !payload.data){ toast('זה לא קובץ גיבוי של Talki'); return; }

  if(mode === 'replace'){
    for(const k of await Store.keys()) await Store.del(k);
  }
  const entries = Object.entries(payload.data);
  for(const [k,v] of entries){
    if(mode === 'merge' && k === K.progress){
      const current = (await Store.get(k)) || [];
      await Store.set(k, [...new Set([...current, ...(v||[])])]);
    } else {
      await Store.set(k, v);
    }
  }
  recordings = {};
  learned = new Set(); stats = {}; custom = [];
  await loadAll();
  toast(`שוחזרו ${entries.length} פריטים ✅`);
}

async function loadAll(){
  await Store.detect();
  const [p,st,se,idx] = await Promise.all([sGet(K.progress), sGet(K.stats), sGet(K.settings), sGet(K.customIndex)]);
  if(p) learned = new Set(p);
  if(st) stats = st;
  if(se) settings = Object.assign(settings, se);
  if(idx && idx.length){
    const loaded = await Promise.all(idx.map(id=>sGet(K.custom(id))));
    custom = loaded.filter(Boolean);
  }
  render();
}
const saveProgress = ()=> sSet(K.progress,[...learned]);
const saveStats    = ()=> sSet(K.stats,stats);
const saveSettings = ()=> sSet(K.settings,settings);

const NIQQUD = /[\u0591-\u05C7]/g;
function display(word){ return settings.niqqud ? word : word.replace(NIQQUD,''); }
function plain(word){ return word.replace(NIQQUD,''); }
function allCats(){
  const list = Object.values(CATEGORIES).map(c=>({...c}));
  list.push({ id:'mine', title:'הַמִּלִּים שֶׁלִּי', icon:'💜', cls:'c-mine', items:custom });
  return list;
}
function getCat(id){ return allCats().find(c=>c.id===id); }
function key(catId,word){ return catId+':'+word; }
function totalWords(){ return allCats().reduce((s,c)=>s+c.items.length,0); }
function catLearned(cat){ return cat.items.filter(i=>learned.has(key(cat.id,i.word))).length; }
function shuffle(a){ const x=[...a]; for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }

/* SRS-lite: words answered wrong (or never seen) get picked first */
function weightedPick(items, catId, n){
  const scored = items.map(it=>{
    const s = stats[key(catId,it.word)] || {seen:0,wrong:0};
    const weight = 1 + s.wrong*3 - Math.min(s.seen,4)*0.4 + Math.random()*1.2;
    return {it, weight};
  });
  scored.sort((a,b)=>b.weight-a.weight);
  return scored.slice(0,n).map(s=>s.it);
}
function markSeen(catId,word,wrong){
  const k = key(catId,word);
  const s = stats[k] || {seen:0,wrong:0};
  s.seen++; if(wrong) s.wrong++; else s.wrong = Math.max(0, s.wrong-1);
  stats[k] = s; saveStats();
}

const speechOk = 'speechSynthesis' in window;

if(speechOk){
  iosKeepAlive = setInterval(()=>{
    if(window.speechSynthesis.speaking && window.speechSynthesis.paused) window.speechSynthesis.resume();
  }, 5000);
}
let heVoice = null;
function pickVoice(){
  if(!speechOk) return;
  const voices = window.speechSynthesis.getVoices() || [];
  heVoice = voices.find(v=>/^he/i.test(v.lang)) || null;
}
if(speechOk){ pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }

let currentAudio = null;
async function say(catId, word, opts){
  opts = opts || {};
  const k = key(catId, word);
  if(currentAudio){ currentAudio.pause(); currentAudio = null; }
  if(recordings[k] === undefined){
    recordings[k] = await sGet(K.rec(k)) || null;
  }
  if(recordings[k]){
    AudioManager.setVoicePromptPlaying(true);
    const done = once(()=>{ AudioManager.setVoicePromptPlaying(false); if(opts.after) opts.after(); });
    currentAudio = new Audio(recordings[k]);
    currentAudio.onended = done; currentAudio.onerror = done;
    currentAudio.play().catch(()=>{ AudioManager.setVoicePromptPlaying(false); speakTTS(word, {core:true}); done(); });
    setTimeout(done, 6000);
    return;
  }
  speakTTS(word, {...opts, core:true});
}
function once(fn){ let used=false; return ()=>{ if(used||!fn) return; used=true; fn(); }; }
function estimateMs(text){
  const words = String(text).trim().split(/\s+/).length;
  return Math.max(1200, Math.round((words*480 + 500) / Math.max(settings.rate,0.5)));
}
function speakTTS(text, opts){
  opts = opts || {};
  if(!settings.voice && !opts.core){ if(opts.after) setTimeout(opts.after, 10); return; }
  AudioManager.setVoicePromptPlaying(true);
  const done = once(()=>{ AudioManager.setVoicePromptPlaying(false); if(opts.after) opts.after(); });
  if(!speechOk){ setTimeout(done, estimateMs(text)); return; }
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='he-IL'; u.rate=settings.rate; u.pitch=1.1;
    if(heVoice) u.voice = heVoice;
    u.onend = done; u.onerror = done;
    window.speechSynthesis.speak(u);
  }catch(e){}
  // safety net: some browsers never fire onend (no Hebrew voice, muted tab, iOS)
  setTimeout(done, estimateMs(text) + 900);
}

  opts = opts || {};

const MIN_ITEMS = {quiz:4,memory:4,match:4,missing:4,sort:4,receptive:4,sounds:4,
                   count:1,focus:1,temptation:1,bubbles:1,speech:2,combine:3,pairs:2,cloze:1};
function startGame(type, catId){
  const need = MIN_ITEMS[type] || 4;
  let cat = getCat(catId);
  if(!cat || cat.items.length < need) cat = allCats().find(c=>c.items.length >= need);
  if(!cat){ view='home'; return false; }
  activeCat = cat.id;
  view = type;
  AudioManager.playSfx('game.levelStart');
  if(type==='quiz'){
    const pool = weightedPick(cat.items, cat.id, Math.min(8,cat.items.length));
    game = {type,catId:cat.id,pool,i:0,score:0,streak:0,best:0,locked:false,done:false};
    setupQuizRound();
  } else if(type==='memory'){
    const picks = weightedPick(cat.items, cat.id, 6);
    const cards = shuffle(picks.flatMap((it,n)=>[
      {pair:n,kind:'pic',it},{pair:n,kind:'word',it}
    ])).map((c,i)=>({...c,idx:i,open:false,matched:false}));
    game = {type,catId:cat.id,cards,first:null,moves:0,found:0,total:picks.length,locked:false,done:false};
  } else if(type==='missing'){
    game = {type,catId:cat.id,round:0,score:0,done:false,phase:'show'};
    setupMissingRound();
  } else if(type==='match'){
    const picks = weightedPick(cat.items, cat.id, Math.min(5,cat.items.length));
    game = {type,catId:cat.id,left:shuffle(picks),right:shuffle(picks),sel:null,matched:[],done:false};
  } else if(type==='speech'){
    const pool = weightedPick(cat.items, cat.id, Math.min(6,cat.items.length));
    game = {type,catId:cat.id,pool,i:0,score:0,listening:false,feedback:'',done:false};
  } else if(type==='bubbles'){
    game = {type,catId:cat.id,popped:0,total:12,done:false};
  } else if(type==='sounds'){
    const animals = CATEGORIES.animals.items.filter(i=>i.sound);
    game = {type,catId:'animals',pool:shuffle(animals).slice(0,6),i:0,score:0,locked:false,done:false};
    activeCat='animals'; setupSoundsRound();
  } else if(type==='count'){
    game = {type,catId:cat.id,round:0,score:0,locked:false,done:false};
    setupCountRound();
  } else if(type==='focus'){
    const target = weightedPick(cat.items, cat.id, 1)[0];
    game = {type,catId:cat.id,it:target,step:0,total:CARRIERS.length,done:false};
  } else if(type==='cloze'){
    game = {type,catId:cat.id,pool:shuffle(CLOZE).slice(0,6),i:0,phase:'say',score:0,done:false};
  } else if(type==='temptation'){
    game = {type,catId:cat.id,pool:weightedPick(cat.items,cat.id,6),i:0,opened:false,listening:false,done:false};
  } else if(type==='receptive'){
    game = {type,catId:cat.id,level:2,i:0,score:0,run:0,miss:0,locked:false,done:false};
    setupReceptiveRound();
  } else if(type==='pairs'){
    game = {type,catId:cat.id,pool:shuffle(PAIRS).slice(0,6),i:0,score:0,locked:false,done:false};
    setupPairsRound();
  } else if(type==='combine'){
    game = {type,catId:cat.id,round:0,mod:null,phrase:'',pics:weightedPick(cat.items,cat.id,3),done:false};
  } else if(type==='sort'){
    game = {type,catId:cat.id,round:0,score:0,locked:false,done:false};
    setupSortRound();
  }
  return true;
}
function launch(type, catId){
  if(!startGame(type, catId)){ toast('צריך לפחות 4 מילים בקטגוריה'); }
  render();
}

function spawnBubble(){
  const host = document.getElementById('bubbleHost');
  if(!host || !game || game.type!=='bubbles' || game.done){ clearInterval(bubbleTimer); bubbleTimer=null; return; }
  const cat = getCat(game.catId);
  const it = cat.items[Math.floor(Math.random()*cat.items.length)];
  const b = document.createElement('button');
  b.className='bubble';
  const size = 84 + Math.random()*46;
  b.style.width = b.style.height = size+'px';
  b.style.left = (4 + Math.random()*74)+'%';
  b.style.setProperty('--drift', (Math.random()*60-30)+'px');
  const dur = 8 + Math.random()*4;
  b.style.animationDuration = dur+'s';
  b.innerHTML = `<span class="b-em">${media(it)}</span><span class="b-w">${display(it.word)}</span>`;
  b.addEventListener('click', ()=>{
    if(b.classList.contains('pop-out')) return;
    b.classList.add('pop-out'); setTimeout(()=>b.remove(), 280);
    const willComplete = game.popped+1 >= game.total;
    say(game.catId, it.word); chime(true, {isLevelComplete: willComplete});
    const k = key(game.catId, it.word);
    if(!learned.has(k)){ learned.add(k); saveProgress(); }
    game.popped++;
    const chip = document.querySelector('.stat-chip');
    if(chip) chip.textContent = `🫧 ${game.popped}/${game.total}`;
    updateHeader();
    if(game.popped>=game.total){ clearInterval(bubbleTimer); bubbleTimer=null; game.done=true; confetti(34); setTimeout(render,400); }
  });
  host.appendChild(b);
  setTimeout(()=>b.remove(), dur*1000+300);
}

/* B. Cloze + expectant pause — 5 silent seconds, then model */
function renderCloze(){
  if(!game || game.type!=='cloze'){ if(!startGame('cloze', activeCat)) return renderHome(); }
  if(game.done) return gameHeader('⏸️ משלימים ביחד','',true) +
    doneCard(game.score, game.pool.length, 0, 'כל השלמה נחשבת');
  const it = game.pool[game.i];
  const body = game.phase==='wait'
    ? `${mascot('listen', 96)}<p>מחכים... תני לה חמש שניות שלמות</p>`
    : game.phase==='model'
      ? `<div style="font-size:4rem">${media(it)}</div><div class="prompt-word">${display(it.answer)}</div>`
      : `<div style="font-size:3.4rem">🗣️</div><p>מקשיבים למשפט...</p>`;
  return gameHeader('⏸️ משלימים ביחד', chips([`${game.i+1}/${game.pool.length}`,`✅ ${game.score}`]), true) +
    `<div class="prompt-box"><div class="prompt-word">${display(it.phrase)}</div>${body}
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px">
        <button class="big-btn b-leaf" data-clozeyes="1">✅ היא אמרה!</button>
        <button class="pill-btn" data-clozenext="1">להמשיך ◀</button>
      </div>
      <p class="hint">כל ניסיון נחשב — גם צליל, גם הברה אחת</p></div>`;
}
function runCloze(){
  const it = game.pool[game.i];
  game.phase='say'; render();
  speakTTS(plain(it.phrase), {after:()=>{
    if(!game || game.type!=='cloze' || game.done || game.phase!=='say') return;
    game.phase='wait'; render();
    clozeTimer = setTimeout(()=>{
      if(!game || game.type!=='cloze' || game.phase!=='wait') return;
      game.phase='model'; render();
      speakTTS(plain(it.answer)+'. '+plain(it.phrase)+' '+plain(it.answer), {});
    }, 5000);
  }});
}
function clozeNext(scored){
  clearTimeout(clozeTimer);
  if(view!=='cloze' && speechOk) window.speechSynthesis.cancel();
  if(scored) game.score++;
  game.i++;
  if(game.i>=game.pool.length){ game.done=true; confetti(24); render(); return; }
  runCloze();
}

function doneCard(score, total, best, extra){
  const ratio = total ? score/total : 0;
  const filled = ratio>=0.85?3:ratio>=0.5?2:1;
  const stars = [0,1,2].map(i=>
    `<img class="reward-star" src="assets/v2/icons/talki-ui-icon-star.png" alt="" style="${i<filled?'':'opacity:.3;filter:grayscale(1)'}">`).join('');
  return `<div class="done-card">${mascot('cheer', 96)}<div class="big">${stars}</div>
    <h3>כל הכבוד!</h3>
    <p>${score} מתוך ${total}${best?` • רצף הכי טוב: ${best}`:''}${extra?` • ${extra}`:''}</p>
